name: Frontend CI - Tests

on:
  push:
    branches: [ main, matsuzaki-dev-site-para-oficina ]
  pull_request:
    branches: [ main ]

jobs:
  test-frontend:
    name: Run frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test --silent

      - name: Upload Jest results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-logs
          path: frontend/jest-junit.xml

      - name: Upload coverage (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
