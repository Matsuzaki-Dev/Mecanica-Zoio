version: '"3.8"'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: workshop
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env.example
    depends_on:
      - db
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    env_file: .env.example
    depends_on:
      - backend
    ports:
      - "3001:3000"

volumes:
  db_data:
